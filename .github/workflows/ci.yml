name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Syntax-check release scripts
        run: |
          set -e
          for f in scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Test release scripts
        run: node --test scripts/*.test.mjs

      - name: Prepare generated Tauri resource directories
        # The release pipeline populates these ignored directories before
        # packaging. Tauri's build script still validates resource paths while
        # Clippy/tests compile metadata in a clean checkout, so empty stubs are
        # the correct CI inputs for code-only Rust checks.
        run: mkdir -p rt node-runtime

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

      - name: Whitespace check
        run: git diff --check

      - name: No machine-specific paths
        run: |
          set -e
          if grep -rnE "D:[\\\\/]vibe|[0-9]{5}@qq\.com|C:[\\\\/]Users" --include="*.mjs" --include="*.rs" --include="*.json" --include="*.md" --include="*.cmd" .; then
            echo "machine-specific paths found" >&2
            exit 1
          fi
          echo "clean"
