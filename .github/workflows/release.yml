name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev
          # AppImage linuxdeploy needs FUSE; package renamed on 24.04.
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Run release pipeline (fetch DSH source -> build -> package)
        # On tag pushes stamp the artifact version from the tag (v0.1.4 -> 0.1.4);
        # manual dispatch has no version, so the checked-in defaults are used.
        run: node scripts/release.mjs ${{ github.ref_type == 'tag' && format('--version {0}', github.ref_name) || '' }}
        env:
          CI: "true"
          # Optional production macOS signing/notarization secrets. Tauri
          # ignores these on other platforms. release.mjs falls back to a
          # complete ad-hoc signature when APPLE_SIGNING_IDENTITY is empty.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # linuxdeploy on CI: avoid FUSE (extract-and-run), skip strip issues,
          # and keep verbose output so bundler failures surface the real error.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          TAURI_VERBOSE: "1"
          # Tauri updater artifacts use a separate minisign key. Only the
          # public key is embedded in tauri.conf.json; this private key lives
          # exclusively in GitHub Actions secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # This project's updater key is deliberately passwordless because
          # GitHub already encrypts the secret and CI cannot answer prompts.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Create updater manifest fragment
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node scripts/updater-manifest.mjs
          --fragment src-tauri/target/release/bundle/updater-fragment-${{ runner.os }}.json
          --bundle-root src-tauri/target/release/bundle
          --version ${{ github.ref_name }}
          --tag ${{ github.ref_name }}
          --repo ${{ github.repository }}

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "macOS app bundle not found" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dvv "$app_path"

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Merge updater manifest
        run: node scripts/updater-manifest.mjs --merge-dir artifacts --output artifacts/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-setup.exe.sig
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.deb.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/latest.json
          generate_release_notes: true
