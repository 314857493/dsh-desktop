[package]
name = "dsh-desktop"
version = "0.1.37"
description = "DeepSeek Harness desktop shell (Tauri): launches the dsh web server and hosts its GUI"
authors = ["DSH Desktop"]
edition = "2021"
license = "MIT"
repository = "https://github.com/314857493/dsh-desktop"

[lib]
name = "dsh_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Windows and Linux update from raw NSIS/AppImage/DEB installers. ZIP
# extraction is unused; macOS tar.gz support is unconditional in the plugin.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cookie = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
